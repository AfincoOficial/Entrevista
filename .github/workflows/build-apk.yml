name: Gerar APK ALPHA CRM 051

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Verificar arquivo de origem
        run: |
          set -euxo pipefail
          test -f APK-ANDROID-047.zip
          unzip -l APK-ANDROID-047.zip | head -80

      - name: Preparar projeto Android 048
        run: |
          set -euxo pipefail
          rm -rf android-project
          mkdir -p android-project
          unzip -q APK-ANDROID-047.zip -d android-project
          test -d android-project/APK-ANDROID
          test -f android-project/APK-ANDROID/settings.gradle
          test -f android-project/APK-ANDROID/app/src/main/AndroidManifest.xml

      - name: Aplicar configuração 048
        working-directory: android-project/APK-ANDROID
        run: |
          set -euxo pipefail
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.afinco.alphacrm'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.afinco.alphacrm'
                  minSdk 23
                  targetSdk 35
                  versionCode 48
                  versionName '1.0.48'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          EOF

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Não usamos android-actions/setup-android@v3.
      # Na execução anterior, essa action tentou executar "sdkmanager tools".
      # O pacote "tools" não existe mais no repositório atual do Android SDK.
      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          echo "=== SDK INSTALADO ==="
          "$SDKMANAGER" --list_installed | sed -n '1,160p'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Limpar caches e daemon
        run: |
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/daemon

      - name: Diagnóstico antes do build
        working-directory: android-project/APK-ANDROID
        run: |
          set -euxo pipefail
          java -version
          gradle --version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          find . -maxdepth 5 -type f | sort | head -250

      - name: Gerar APK 048
        working-directory: android-project/APK-ANDROID
        run: |
          set -o pipefail
          gradle clean assembleDebug --no-daemon --no-watch-fs --refresh-dependencies --stacktrace --info 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Publicar log do Gradle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALPHA-CRM-051-gradle-log
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ALPHA-CRM-1.0.48
          path: android-project/APK-ANDROID/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
