name: Gerar APK ALPHA CRM

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Limpar caches locais do build
        run: |
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/daemon

      - name: Gerar APK
        working-directory: APK-ANDROID
        run: |
          gradle --version
          gradle clean assembleDebug --no-daemon --no-watch-fs --refresh-dependencies --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ALPHA-CRM-1.0.48
          path: APK-ANDROID/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
